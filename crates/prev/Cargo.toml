[package]
name = "prev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14", features = ["advanced", "canvas", "highlighter", "image-without-codecs", "markdown"] }
iced_runtime = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
material-colors = { version = "0.4", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
tiny-skia = "0.11"
toml = "1"
usvg = "0.46"
prev-image.workspace = true
prev-pdf.workspace = true
prev-store.workspace = true


# The desktop portal and Wayland drag and drop; Windows has its own side
# in each module that uses them.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "open_uri", "print", "settings"] }
smithay-clipboard = "0.7"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
interprocess = "2"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
