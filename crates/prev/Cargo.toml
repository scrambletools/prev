[package]
name = "prev"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser", "open_uri", "print", "settings"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iced = { version = "0.14", features = ["advanced", "canvas", "highlighter", "image-without-codecs", "markdown"] }
iced_runtime = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
material-colors = { version = "0.4", default-features = false, features = ["std"] }
raw-window-handle = "0.6"
resvg = "0.46"
serde = { version = "1", features = ["derive"] }
smithay-clipboard = "0.7"
tempfile = "3"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
tiny-skia = "0.11"
toml = "1"
usvg = "0.46"
prev-image.workspace = true
prev-pdf.workspace = true
prev-store.workspace = true

