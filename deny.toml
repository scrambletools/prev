# Dependency policy: open source only, and compatible with AGPL-3.0-or-later.

[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# The mupdf crates declare the deprecated "AGPL-3.0" id. MuPDF itself is
# AGPL-3.0-or-later; the bindings do not say "or later", so treat them as
# AGPL-3.0-only, which prev's AGPL-3.0-or-later license satisfies.
[[licenses.exceptions]]
crate = "mupdf"
allow = ["AGPL-3.0"]

[[licenses.exceptions]]
crate = "mupdf-sys"
allow = ["AGPL-3.0"]

# rawler declares the deprecated "LGPL-2.1" id (2.1 only). LGPL-2.1 section 3
# allows relicensing to GPL-2.0-or-later, which combines with AGPL-3.0.
[[licenses.exceptions]]
crate = "rawler"
allow = ["LGPL-2.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"
# Only fail on unmaintained crates we depend on directly.
unmaintained = "workspace"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
