<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a86ec"/>
      <stop offset="1" stop-color="#2556c0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6fd6"/>
      <stop offset="1" stop-color="#a9b8e8"/>
    </linearGradient>
    <clipPath id="picture">
      <rect x="38" y="30" width="52" height="34" rx="5"/>
    </clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b2a6b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#tile)"/>
  <!-- page -->
  <g filter="url(#lift)">
    <path d="M36 18 H78 L96 36 V102 a8 8 0 0 1 -8 8 H36 a8 8 0 0 1 -8 -8 V26 a8 8 0 0 1 8 -8 Z" fill="#ffffff"/>
  </g>
  <path d="M78 18 V30 a6 6 0 0 0 6 6 H96 Z" fill="#d6e0f7"/>
  <!-- picture on the page -->
  <g clip-path="url(#picture)">
    <rect x="38" y="30" width="52" height="34" fill="url(#sky)"/>
    <circle cx="76" cy="41" r="5" fill="#ffe08a"/>
    <path d="M38 56 C46 48 52 50 58 54 C64 58 70 50 78 49 C83 48 87 52 90 54 V64 H38 Z" fill="#3f7a73"/>
    <path d="M38 60 C46 55 54 58 62 58 C70 58 76 54 90 58 V64 H38 Z" fill="#23513f"/>
  </g>
  <!-- text lines, one highlighted -->
  <rect x="38" y="72" width="44" height="8" rx="3" fill="#ffd54a"/>
  <rect x="40" y="74.5" width="40" height="3" rx="1.5" fill="#5b6478"/>
  <rect x="40" y="84.5" width="46" height="3" rx="1.5" fill="#9aa3b5"/>
  <rect x="40" y="94.5" width="32" height="3" rx="1.5" fill="#9aa3b5"/>
</svg>
